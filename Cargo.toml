[package]
name = "markdown-snippet-manager"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A keyboard-driven launcher for searching and copying local Markdown content"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arunsaini719/markdown-launcher"
publish = false

[dependencies]
blake3 = "1.8.7"
directories = "6.0.0"
global-hotkey = "0.8.0"
globset = "0.4.20"
gpui-kit = "0.7.3"
notify = "8.2.0"
pulldown-cmark = { version = "0.13", default-features = false }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3.0"
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"
tempfile = "3.27.0"
walkdir = "2.5.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
macos-window-visibility = { path = "native/macos-window-visibility" }
macos-file-metadata = { path = "native/macos-file-metadata" }
rfd = { version = "0.17.2", default-features = false }
single-instance = "0.3.3"
smappservice-rs = "0.1.3"
tray-icon = { version = "0.26.1", default-features = false }

[dev-dependencies]
gpui-kit = { version = "0.7.3", features = ["test-support"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }

[profile.release]
lto = "thin"
strip = "symbols"
