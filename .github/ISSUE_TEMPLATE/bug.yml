name: Bug report
description: Report reproducible behavior that is not working as expected
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Markdown Launcher. Remove private note content, credentials, and personal paths before submitting.

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS 15 or later
        - Linux with X11
        - Linux with Wayland
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Provide the app version or output of `git rev-parse --short HEAD`.
      placeholder: 0.1.0 or 53e7e64
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use a temporary scan root and minimal Markdown files when possible.
      placeholder: |
        1. Configure...
        2. Open...
        3. Press...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant diagnostics
      description: Paste bounded logs or error text after removing sensitive information.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for the same behavior.
          required: true
        - label: I removed personal note content, credentials, and sensitive paths.
          required: true
