name: Feature request
description: Propose an improvement to the Markdown Launcher workflow
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem before proposing implementation details. Significant changes should stay within the documented product scope.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult or impossible today, and who encounters it?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed workflow
      description: Describe the visible interaction, including relevant keyboard behavior.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain current workarounds or simpler approaches you considered.

  - type: dropdown
    id: platform
    attributes:
      label: Primary platform
      options:
        - All supported platforms
        - macOS
        - Linux
        - Unsure
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I reviewed the product scope and searched existing issues.
          required: true
